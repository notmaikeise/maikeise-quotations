<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <base target="_top">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Maikeise Quotations</title>
</head>

<body>

    <main>

        <header>
            <h1>Maikeise Quotations</h1>
            <p>Cadastro de cotação</p>
        </header>

        <form id="quotation-form">

            <section>
                <h2>Identificação</h2>

                <div>
                    <label for="rfp">RFP *</label>
                    <input id="rfp" name="rfp" type="text" required>
                </div>

                <div>
                    <label for="itemCode">Código do item *</label>
                    <input id="itemCode" name="itemCode" type="text" required>
                </div>

                <div>
                    <label for="reference">Referência *</label>
                    <input id="reference" name="reference" type="text" required>
                </div>

                <div>
                    <label for="description">Descrição *</label>
                    <textarea id="description" name="description" required></textarea>
                </div>

                <div>
                    <label for="supplier">Fornecedor *</label>
                    <input id="supplier" name="supplier" type="text" required>
                </div>
            </section>


            <section>
                <h2>Valores</h2>

                <div>
                    <label for="quantity">Quantidade *</label>
                    <input id="quantity" name="quantity" type="number" min="0.01" step="any" required>
                </div>

                <div>
                    <label for="unitValue">
                        Valor unitário *
                    </label>

                    <input id="unitValue" name="unitValue" type="number" min="0" step="0.01" required>
                </div>

                <div>
                    <label for="totalValue">
                        Valor total
                    </label>

                    <input id="totalValue" type="text" readonly>
                </div>
            </section>


            <section>
                <h2>Informações comerciais</h2>

                <div>
                    <label for="ncm">NCM *</label>
                    <input id="ncm" name="ncm" type="text" inputmode="numeric" maxlength="10" required>
                </div>

                <div>
                    <label for="deadline">Prazo *</label>
                    <input id="deadline" name="deadline" type="text" required>
                </div>

                <div>
                    <label for="payment">Pagamento *</label>
                    <input id="payment" name="payment" type="text" required>
                </div>

                <div>
                    <label for="delivery">Entrega *</label>
                    <input id="delivery" name="delivery" type="text" required>
                </div>

                <div>
                    <label for="requestedAt">
                        Data solicitada *
                    </label>

                    <input id="requestedAt" name="requestedAt" type="date" required>
                </div>
            </section>


            <section>
                <div>
                    <h2>Dados opcionais</h2>

                    <p>
                        Adicione outras informações relevantes
                        desta cotação.
                    </p>
                </div>

                <div id="optional-data-container"></div>

                <button type="button" id="add-optional-data">
                    Adicionar campo
                </button>
            </section>


            <section>
                <div id="form-message"></div>

                <button type="submit" id="submit-button">
                    Salvar cotação
                </button>
            </section>

        </form>

    </main>

    <script>
        const form =
            document.getElementById('quotation-form');

        const quantityInput =
            document.getElementById('quantity');

        const unitValueInput =
            document.getElementById('unitValue');

        const totalValueInput =
            document.getElementById('totalValue');

        const optionalDataContainer =
            document.getElementById(
                'optional-data-container'
            );

        const addOptionalDataButton =
            document.getElementById(
                'add-optional-data'
            );

        const submitButton =
            document.getElementById('submit-button');

        const formMessage =
            document.getElementById('form-message');


        quantityInput.addEventListener(
            'input',
            updateTotal
        );

        unitValueInput.addEventListener(
            'input',
            updateTotal
        );


        function updateTotal() {
            const quantity =
                Number(quantityInput.value) || 0;

            const unitValue =
                Number(unitValueInput.value) || 0;

            const total =
                quantity * unitValue;

            totalValueInput.value =
                total.toLocaleString(
                    'pt-BR',
                    {
                        style: 'currency',
                        currency: 'BRL',
                    }
                );
        }


        addOptionalDataButton.addEventListener(
            'click',
            addOptionalField
        );


        function addOptionalField() {
            const row =
                document.createElement('div');

            row.className = 'optional-data-row';

            row.innerHTML = `
      <input
        type="text"
        class="optional-key"
        placeholder="Campo"
        aria-label="Nome do campo opcional"
      >

      <input
        type="text"
        class="optional-value"
        placeholder="Valor"
        aria-label="Valor do campo opcional"
      >

      <button
        type="button"
        class="remove-optional-data"
      >
        Remover
      </button>
    `;

            row
                .querySelector('.remove-optional-data')
                .addEventListener(
                    'click',
                    () => row.remove()
                );

            optionalDataContainer.appendChild(row);
        }


        function getOptionalData() {
            const rows =
                optionalDataContainer.querySelectorAll(
                    '.optional-data-row'
                );

            return Array
                .from(rows)
                .map((row, index) => {
                    const key =
                        row.querySelector('.optional-key')
                            .value
                            .trim();

                    const value =
                        row.querySelector('.optional-value')
                            .value
                            .trim();

                    return {
                        key,
                        value,
                        order: index,
                    };
                })
                .filter(entry => entry.key !== '');
        }


        form.addEventListener(
            'submit',
            handleSubmit
        );


        function handleSubmit(event) {
            event.preventDefault();

            if (!form.reportValidity()) {
                return;
            }

            setLoading(true);

            showMessage(
                'Salvando cotação...',
                'loading'
            );

            const data = {
                rfp: form.rfp.value.trim(),
                itemCode: form.itemCode.value.trim(),
                reference: form.reference.value.trim(),
                description:
                    form.description.value.trim(),
                supplier: form.supplier.value.trim(),

                quantity: Number(form.quantity.value),
                unitValue:
                    Number(form.unitValue.value),

                ncm: form.ncm.value.trim(),
                deadline: form.deadline.value.trim(),
                payment: form.payment.value.trim(),
                delivery: form.delivery.value.trim(),

                requestedAt:
                    form.requestedAt.value,

                optionalData: getOptionalData(),
            };

            google.script.run
                .withSuccessHandler(
                    handleRegistrationSuccess
                )
                .withFailureHandler(
                    handleCommunicationFailure
                )
                .registerQuotation(data);
        }


        function handleRegistrationSuccess(result) {
            setLoading(false);

            if (!result.success) {
                showMessage(
                    result.message ||
                    'Não foi possível salvar a cotação.',
                    'error'
                );

                return;
            }

            let message =
                'Cotação cadastrada com sucesso.';

            if (
                result.warnings &&
                result.warnings.length > 0
            ) {
                message +=
                    '\n\nAvisos:\n' +
                    result.warnings.join('\n');
            }

            showMessage(
                message,
                result.warnings?.length
                    ? 'warning'
                    : 'success'
            );

            resetForm();
        }


        function handleCommunicationFailure(error) {
            setLoading(false);

            console.error(error);

            showMessage(
                'Erro de comunicação com o servidor.',
                'error'
            );
        }


        function setLoading(isLoading) {
            submitButton.disabled = isLoading;

            submitButton.textContent =
                isLoading
                    ? 'Salvando...'
                    : 'Salvar cotação';
        }


        function showMessage(message, type) {
            formMessage.textContent = message;
            formMessage.dataset.type = type;
        }


        function resetForm() {
            form.reset();

            optionalDataContainer.innerHTML = '';

            totalValueInput.value = '';

            quantityInput.focus();
        }
    </script>

</body>

</html>
